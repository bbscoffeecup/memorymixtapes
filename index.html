<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#243958">
  <meta name="description" content="My personal music profile.">
  <title>My Music Profile</title>
  <link rel="stylesheet" href="try2.css">
  <script src="script.js" defer></script>
</head>

<body>
  <main class="profile">

    <!-- PERSONAL PROFILE -->
    <section class="profile-card" aria-labelledby="profile-name">
      <img
        class="avatar"
        src="images/avatar.jpg"
        alt="My profile picture"
      >

      <p class="eyebrow">A LITTLE ABOUT ME</p>
      <h1 id="profile-name">Safa <span aria-hidden="true">💗</span></h1>
      <p class="username">@safahayan</p>

      <p class="bio">Living life one song at a time ♫</p>

      <div class="profile-details">
        <span>🎧 Music lover</span>
      </div>
    </section>

    <!-- CD PLAYER -->
    <section class="player-card" aria-labelledby="album-title">
      <p class="eyebrow">NOW SPINNING ♫</p>

      <div class="casette-rack">
       
      </div>
	  
	  <div class="casette-area">
       
      </div>

      <div class="album-info" aria-live="polite">
        <h2 id="album-title">My Playlist</h2>
        <p id="artist-name">A collection of favourites</p>
      </div>

      <audio id="audio" preload="metadata"></audio>

      <div class="progress-area">
        <label class="sr-only" for="progress">Song progress</label>
        <input id="progress" type="range"
               min="0" max="100" value="0" step="0.1">

        <div class="timestamps">
          <span id="current-time">0:00</span>
          <span id="duration">0:00</span>
        </div>
      </div>

      <div class="controls" aria-label="Music player controls">
        <button id="previous" class="control"
                type="button" aria-label="Previous song">|◀</button>

        <button id="play" class="play-button"
                type="button" aria-label="Play music">▶</button>

        <button id="next" class="control"
                type="button" aria-label="Next song">▶|</button>
      </div>

      <div class="extra-controls">
        <button id="shuffle" class="text-control"
                type="button" aria-pressed="false">
          ⇄ Shuffle: Off
        </button>

        <button id="repeat" class="text-control"
                type="button" aria-pressed="false">
          ↻ Repeat: Off
        </button>
      </div>

      <div class="volume-area">
        <label for="volume">Volume</label>
        <input id="volume" type="range"
               min="0" max="1" value="0.7" step="0.05">
      </div>

      <h3 class="playlist-heading">TRACKLIST</h3>
      <ol id="playlist" class="playlist"></ol>

      <p id="status" class="status" role="status">
        Ready to play
      </p>
    </section>

    <footer>
      made with ♡ and music
    </footer>

  </main>
</body>
</html>
